services:
  drone-nav:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drone-nav
    ports:
      - "8000:8000"
    volumes:
      - ./configs:/app/configs
      - ./exports:/app/exports
      - ./Amazonbindata/img:/app/Amazonbindata/img:ro
    environment:
      - PYTHONUNBUFFERED=1
    command: ["viewer", "--config", "medium", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
