      position: [0.2, 12.0, 0.0]
      width: 3.0
      height: 4.0
    - id: "DOOR-EAST"
      position: [41.8, 12.0, 0.0]
      width: 3.0
      height: 4.0

  charging_stations:
    - id: "CHARGE-01"
      position: [2.0, 1.5, 0.0]
      charge_rate_kw: 1.2
    - id: "CHARGE-02"
      position: [39.0, 1.5, 0.0]
      charge_rate_kw: 1.2

  takeoff_landing_pads:
    - id: "PAD-HOME-A"
      position: [2.0, 1.5, 0.0]
      radius: 0.7
    - id: "PAD-HOME-B"
      position: [39.0, 1.5, 0.0]
      radius: 0.7

  no_fly_zones:
    - id: "NFZ-CONVEYOR"
      name: "Automated Conveyor Spine"
      polygon:
        - [15.0, 0.0]
        - [26.0, 0.0]
        - [26.0, 2.2]
        - [15.0, 2.2]
      z_min: 0.0
      z_max: 3.5

  people_zones:
    - id: "PZ-MEZZANINE-ENTRY"
      name: "Pedestrian Crosswalk"
      polygon:
        - [0.0, 23.0]
        - [42.0, 23.0]
        - [42.0, 25.5]
        - [0.0, 25.5]
      max_speed_mps: 1.0

obstacles:
  static:
    - id: "PILLAR-01"
      type: "pillar"
      position: [11.0, 22.0, 0.0]
      dimensions: [0.6, 0.6, 6.5]
    - id: "PILLAR-02"
      type: "pillar"
      position: [30.0, 22.0, 0.0]
      dimensions: [0.6, 0.6, 6.5]
  dynamic:
    - id: "FORKLIFT-01"
      type: "forklift"
      path:
        - [2.0, 24.0, 0.0]
        - [40.0, 24.0, 0.0]
      speed_mps: 1.5
      schedule_start_s: 30.0
      schedule_end_s: 300.0
  random_seed: 42
  random_count: 0

drone:
  mass_kg: 2.8
  max_speed_mps: 3.0
  max_accel_mps2: 1.8
  max_yaw_rate_radps: 1.57
  battery:
    capacity_wh: 220.0
    hover_power_w: 220.0
    forward_power_w_per_mps: 20.0
    climb_power_w_per_mps: 30.0
    safe_reserve_pct: 20.0
    critical_reserve_pct: 10.0
  camera:
    resolution_w: 1920
    resolution_h: 1080
    hfov_deg: 70.0
    vfov_deg: 45.0
    mount_angle_deg: 0.0
    standoff_distance_m: 1.0
    exposure_time_s: 0.003
    max_blur_speed_mps: 1.5
  sensors:
    imu_accel_bias: 0.02
    imu_accel_noise: 0.04
    imu_gyro_bias: 0.004
    imu_gyro_noise: 0.01
    marker_pos_noise: 0.02
    marker_miss_prob: 0.04
    lidar_range_max_m: 12.0
    lidar_noise_m: 0.02

localisation:
  marker_size_m: 0.18
  marker_spacing:
    rack_ends: true
    every_n_bays: 2
  pose_noise: 0.025
  drift_model:
    walk_std_mps: 0.03
  fusion_filter:
    process_noise_pos: 0.01
    process_noise_vel: 0.05
    meas_noise_marker: 0.025
    meas_noise_imu: 0.08

mission:
  target_zones: ["Z-ZONE-A"]
  target_bins: []
  priority: "normal"
  scan_strategy: "serpentine"
  max_flight_duration_s: 1500.0
  return_to_charge_rules:
    threshold_pct: 25.0
    pad_id: "PAD-HOME-A"

safety:
  min_rack_clearance_m: 0.5
  geofence_margin_m: 0.6
  battery_reserve_pct: 20.0
  link_loss_behaviour: "hover_then_land"
  localisation_loss_behaviour: "hover_then_land"
  emergency_stop_decel_mps2: 4.0

export:
  drims_endpoint_url: null
  auth_token: null
  site_id_mapping: "WH01"
  schema_version: "1.0"
  mode: "file"
  output_directory: "exports/medium"
