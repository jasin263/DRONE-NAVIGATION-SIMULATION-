[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-nav"
version = "0.1.0"
description = "Configurable indoor warehouse drone navigation and flight simulation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "drone-nav contributors" }
]
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "networkx>=3.2.1",
    "shapely>=2.0.3",
    "typer>=0.9.4",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "jsonschema>=4.21.1",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "rich>=13.0.0",
    "opencv-python-headless>=4.8.0",
    "zxing-cpp>=2.2.0",
    "pyzbar>=0.1.9",
    "rapidocr-onnxruntime>=1.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.2",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-PyYAML>=6.0.12.20240311"
]

[project.scripts]
drone-nav = "drone_nav.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drone_nav = ["viewer/templates/*.html", "viewer/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["networkx.*", "shapely.*"]
ignore_missing_imports = true
